<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em Público 2026 · XI Encontro Mineiro dos Estudantes do Campo de Públicas</title>
<meta name="description" content="XI Encontro Mineiro dos Estudantes do Campo de Públicas · 06, 07 e 08 de novembro de 2026 · Fundação João Pinheiro, Belo Horizonte.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800;900&amp;family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap">
<style>
body{margin:0;background:#E8FDFF}
a{color:#005A6E}a:hover{color:#003139}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
.wrap{max-width:1680px;margin:0 auto;padding:0 clamp(20px,5vw,96px)}
.ls{font-family:'League Spartan',sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;border-radius:10px;font-family:'League Spartan',sans-serif;font-weight:800;font-size:18px;text-decoration:none;letter-spacing:.02em;transition:transform .25s,background .25s,color .25s,box-shadow .25s;border:0;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.tab:focus-visible,.pbtn:focus-visible,.gtb:focus-visible,.faqb:focus-visible,a:focus-visible{outline:2px solid #4FD9EC;outline-offset:3px}
.arw{display:inline-block;transition:transform .25s}
.btn:hover .arw,a:hover>.arw{transform:translateX(4px)}
.btn-cyan{background:#4FD9EC;color:#003139}.btn-cyan:hover{background:#fff;color:#003139;box-shadow:0 12px 30px rgba(79,217,236,.35)}
.btn-ghost{border:2px solid #4FD9EC;color:#4FD9EC;background:transparent}.btn-ghost:hover{background:#4FD9EC;color:#003139}
.btn-dark{background:#005A6E;color:#fff}.btn-dark:hover{background:#003139;color:#fff}
.navl{color:#ACEAEE;text-decoration:none;font-weight:600;font-size:15px;background:linear-gradient(#4FD9EC,#4FD9EC) 0 100%/0 2px no-repeat;padding-bottom:3px;transition:background-size .3s,color .2s}.navl:hover{color:#fff;background-size:100% 2px}

/* hero */
.hero{min-height:100vh;min-height:100svh;position:relative;overflow:hidden;background:#003139;color:#fff;display:flex;flex-direction:column}
.hero-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,5vw,96px);align-items:center;padding-top:clamp(4px,1.5vh,24px);padding-bottom:clamp(40px,8vh,96px)}
.hero-h1{font-size:clamp(56px,min(10vw,14.5vh),190px) !important}
.hero-logo svg{display:block;max-height:64vh;margin-left:auto}
.cd-box{padding:clamp(6px,1.2vh,12px) clamp(10px,1vw,16px) !important}
.cd-box .ls{font-size:clamp(22px,min(4.2vh,3vw),40px) !important}
.cd{flex-wrap:nowrap !important;gap:clamp(6px,1vw,14px) !important}
.cd-box{min-width:clamp(58px,6.5vw,84px) !important}
.cd-box>div:last-child{font-size:clamp(10px,1vw,12px) !important}
.cd-sep{font-size:clamp(16px,2vw,24px) !important}
.hero-date{font-size:clamp(20px,min(3.6vh,2.4vw),30px) !important}
@media (max-width:1100px){.hero-logo{max-width:min(380px,52vh) !important}.hero nav{gap:18px !important}}
@media (min-width:901px) and (max-width:1100px){.hs3{flex-wrap:nowrap !important;gap:10px !important}.hs3 .btn{padding:0 18px;font-size:16px;white-space:nowrap}}
.hero header a span{white-space:nowrap}
@media (min-width:901px) and (max-height:760px){
.hero header{min-height:60px !important}
.hero-h1{font-size:clamp(48px,min(10vw,12vh),160px) !important}
.hero-kick{margin-bottom:6px !important;font-size:12px !important}
.hs1{margin-top:8px !important}
.hs2{margin-top:10px !important}
.hs3{margin-top:12px !important}
.hs3 .btn{min-height:44px;font-size:16px}
.hero-grid{padding-bottom:clamp(16px,4vh,40px) !important;padding-top:0 !important}
.cd-box{padding:4px 10px !important}
}
.hs1{margin-top:clamp(10px,2.4vh,26px) !important}
.hs2{margin-top:clamp(10px,2.6vh,28px) !important}
.hs3{margin-top:clamp(12px,3vh,30px) !important}
.hs3 .btn{min-height:clamp(44px,6vh,54px)}
@media (max-height:760px){.scroll-wrap{display:none !important}}
.tri{animation:fadeIn 1s ease-out .3s both}
.tri polygon{transition:opacity .3s}
.tri:hover polygon{opacity:.55}.tri polygon:hover{opacity:1}
.h-line{display:block;overflow:hidden;padding-top:.16em;margin-top:-.16em}
.h-line>span{display:block;animation:lineUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes lineUp{from{transform:translateY(105%)}to{transform:none}}
.fade-in{animation:fadeIn 1s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cd-num{display:block;overflow:hidden;line-height:1.05}
.cd-num>span{display:inline-block}
.ta{animation:rollA .35s ease-out}
.tb{animation:rollB .35s ease-out}
@keyframes rollA{from{transform:translateY(25%);opacity:0}to{transform:none;opacity:1}}
@keyframes rollB{from{transform:translateY(25%);opacity:0}to{transform:none;opacity:1}}
.cd-box{position:relative;overflow:hidden}
.cd-bar{display:none}
.cd-sep{align-self:center;color:#4FD9EC;font-family:'League Spartan',sans-serif;font-weight:700;font-size:24px;opacity:.35}

/* scroll details */
.kick{display:flex;align-items:center;gap:12px}
.kick::before{content:none}
.anim .kick::before{width:0;transition:width .8s cubic-bezier(.2,.8,.2,1) .15s}
.anim .kick.in::before{width:28px}
.anim .coc img,.anim .spc{transition:opacity .6s}
.anim .rv .coc img{opacity:.0}
.anim .rv.in .coc img{opacity:1;transition-delay:.2s}
@media (max-width:900px){.cd-sep{display:none}}
.cd{display:flex;gap:14px;flex-wrap:wrap}
.cd-box{background:rgba(79,217,236,.1);border:1px solid rgba(79,217,236,.35);border-radius:10px;padding:12px 16px;min-width:84px;text-align:center}
.bgtri{position:absolute;inset:0;pointer-events:none;opacity:.07}
.scroll-cue{width:28px;height:44px;border:2px solid #4FD9EC;border-radius:14px;position:relative}
.scroll-cue::after{content:'';position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#4FD9EC;animation:cue 1.6s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:#003139;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .7s ease,visibility .7s}
.intro.out{opacity:0;visibility:hidden}
.ilogo{width:min(240px,52vw);overflow:visible;transition:transform .8s cubic-bezier(.6,0,.2,1)}
.intro.out .ilogo{transform:scale(1.12)}
.ilogo polygon{fill-opacity:0;stroke:#4FD9EC;stroke-width:.05;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards,fillIn .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:1;stroke-opacity:0}}
.ilogo polygon:nth-child(1){animation-delay:0.00s,1.25s}.ilogo polygon:nth-child(2){animation-delay:0.04s,1.28s}.ilogo polygon:nth-child(3){animation-delay:0.09s,1.32s}.ilogo polygon:nth-child(4){animation-delay:0.14s,1.35s}.ilogo polygon:nth-child(5){animation-delay:0.18s,1.39s}.ilogo polygon:nth-child(6){animation-delay:0.22s,1.43s}.ilogo polygon:nth-child(7){animation-delay:0.27s,1.46s}.ilogo polygon:nth-child(8){animation-delay:0.32s,1.50s}.ilogo polygon:nth-child(9){animation-delay:0.36s,1.53s}.ilogo polygon:nth-child(10){animation-delay:0.40s,1.56s}.ilogo polygon:nth-child(11){animation-delay:0.45s,1.60s}.ilogo polygon:nth-child(12){animation-delay:0.49s,1.64s}.ilogo polygon:nth-child(13){animation-delay:0.54s,1.67s}.ilogo polygon:nth-child(14){animation-delay:0.58s,1.71s}.ilogo polygon:nth-child(15){animation-delay:0.63s,1.74s}.ilogo polygon:nth-child(16){animation-delay:0.67s,1.77s}.ilogo polygon:nth-child(17){animation-delay:0.72s,1.81s}.ilogo polygon:nth-child(18){animation-delay:0.77s,1.85s}.ilogo polygon:nth-child(19){animation-delay:0.81s,1.88s}.ilogo polygon:nth-child(20){animation-delay:0.85s,1.92s}.ilogo polygon:nth-child(21){animation-delay:0.90s,1.95s}.ilogo polygon:nth-child(22){animation-delay:0.94s,1.99s}.ilogo polygon:nth-child(23){animation-delay:0.99s,2.02s}.ilogo polygon:nth-child(24){animation-delay:1.03s,2.06s}.ilogo polygon:nth-child(25){animation-delay:1.08s,2.09s}
.itxt{animation:itxt .9s cubic-bezier(.2,.8,.2,1) 2.15s both}
@keyframes itxt{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.08em}}
.isub{animation:fadeIn .7s ease-out 2.5s both}
.iskip{position:absolute;bottom:28px;right:28px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid rgba(172,234,238,.4);background:transparent;color:#ACEAEE;font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.iskip:hover{background:#ACEAEE;color:#003139}
.intro-run,.intro-run body{overflow:hidden}
.intro-run .hero *{animation-play-state:paused !important}

/* palestrantes */
.car{display:flex;gap:18px;overflow-x:auto;scroll-behavior:auto;padding:4px 4px 24px;margin:0 -4px;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.sp-sec{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vh,80px) 0 !important}
.sp-h2{font-size:clamp(40px,min(5.5vw,8vh),80px) !important}
.sp-head{margin-bottom:clamp(14px,3vh,40px) !important}
.sp-chips{margin-bottom:clamp(12px,2.6vh,32px) !important}
.spk{flex:0 0 clamp(190px,min(20vw,calc(100vh - 520px)),300px);scroll-snap-align:start;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#02464F;border:1px solid rgba(172,234,238,.12);transition:border-color .35s,transform .35s;animation:openIn .45s ease-out both}
.spk:hover{border-color:rgba(79,217,236,.6);transform:translateY(-3px)}
.av{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:'League Spartan',sans-serif;font-weight:900;font-size:clamp(52px,4.5vw,72px);overflow:hidden}
.av::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,49,57,.85),rgba(0,49,57,0) 45%);pointer-events:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.spk:hover .av img{transform:scale(1.04)}
.av-tag{position:absolute;left:16px;bottom:12px;z-index:2;font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:#4FD9EC}
.spk.hl{border-color:#4FD9EC;box-shadow:0 0 0 3px rgba(79,217,236,.35)}
.spc{width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;display:block}
.spc .go{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#00A3B3;letter-spacing:.06em;opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s}
.spc:hover .go,.spc:focus-visible .go{opacity:1;transform:none}
.car-btn{width:52px;height:52px;border-radius:10px;border:1px solid rgba(172,234,238,.4);background:transparent;color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,color .2s}
.car-btn:hover{background:#4FD9EC;border-color:#4FD9EC;color:#003139}
.car-bar{height:2px;background:rgba(172,234,238,.18);border-radius:2px;overflow:hidden;flex:1;min-width:80px}
.car-bar>span{display:block;height:100%;background:#4FD9EC;transition:width .4s ease}
.chip{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid rgba(172,234,238,.35);background:transparent;color:#ACEAEE;font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:#4FD9EC;color:#fff}
.chip.on{background:#4FD9EC;border-color:#4FD9EC;color:#003139}

/* fundo ingressos */
.ing-bg{position:relative;isolation:isolate}
.ing-bg::before{content:'';position:absolute;inset:0;z-index:-2;background:url(images/auditorio.jpg) center 40%/cover no-repeat;background-attachment:fixed;filter:grayscale(.4) contrast(1.1);opacity:1}
.ing-bg::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,49,57,.78) 0%,rgba(0,90,110,.35) 45%,rgba(0,49,57,.82) 100%);mix-blend-mode:normal}
.loc-bg{position:relative;isolation:isolate;overflow:hidden}
.loc-bg::before{content:'';position:absolute;inset:0;z-index:-2;background:url(images/fjp-auditorio.jpg) center 45%/cover no-repeat;background-attachment:fixed;filter:saturate(.9) contrast(1.05)}
.loc-bg::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(232,253,255,.88) 0%,rgba(232,253,255,.58) 45%,rgba(232,253,255,.15) 100%)}
@media (max-width:900px){.ing-bg::before,.loc-bg::before{background-attachment:scroll}.loc-bg::after{background:linear-gradient(180deg,rgba(232,253,255,.9) 0%,rgba(232,253,255,.78) 50%,rgba(232,253,255,.62) 100%)}
.loc-bg::before{background-position:12% 70%;filter:saturate(.9) contrast(1.05) blur(2px)}}

/* marquee */
.mq{overflow:hidden;background:#02646C;color:#ACEAEE;white-space:nowrap;position:relative;z-index:3}
.mq:hover .mq-track{animation-play-state:paused}
.mq-track{display:inline-flex;gap:36px;padding:12px 0;animation:mq 60s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

/* reveal */
.anim .rv{opacity:0;transform:translateY(12px);transition:opacity .8s ease-out,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*70ms)}
.anim .rv-l{transform:translateX(-14px)}
.anim .rv-r{transform:translateX(14px)}
.anim .rv-s{transform:scale(.98)}
.anim .rv.in{opacity:1;transform:none}

/* tabs & accordions */
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{min-height:56px;padding:0 24px;border-radius:10px;border:2px solid #005A6E;background:transparent;color:#005A6E;font-family:'League Spartan',sans-serif;font-weight:800;font-size:18px;cursor:pointer;transition:background .25s,color .25s,transform .25s}
.tab:hover{background:#E8FDFF}.tab.on:hover{background:#005A6E}
.tab.on{background:#005A6E;color:#fff}
.slot{display:grid;grid-template-columns:180px 1fr;gap:24px;padding:22px 12px;margin:0 -12px;border-top:1px solid #CBE4E7;align-items:start;border-radius:10px;transition:background .25s}
.slot:hover{background:#F3FEFF}
.slot-t{position:relative;padding-left:16px}
.slot-t::before{content:'';position:absolute;left:0;top:.5em;width:8px;height:7px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#93CDD3;transition:background .25s,transform .25s}
.slot:hover .slot-t::before{background:#00A3B3;transform:scale(1.4)}
.pbtn{margin-top:12px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid #00A3B3;background:#fff;color:#005A6E;font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pbtn:hover{background:#E8FDFF}
.chev{display:inline-block;transition:transform .3s}
.chev.up{transform:rotate(180deg)}
.open-in{animation:openIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes openIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.day-in{animation:dayIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes dayIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spc{transition:transform .25s,box-shadow .25s}.spc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,90,110,.1)}
.coc{transition:transform .3s,box-shadow .3s}.coc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,90,110,.1)}
.coc img{transition:border-color .3s}.coc:hover img{border-color:#00A3B3}
.kw{transition:background .2s}.kw:hover{background:#93CDD3}
.rule{transition:background .3s}.rule:hover{background:rgba(255,255,255,.14)}
.sp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px;margin-top:14px}
.gtb{width:100%;display:flex;align-items:center;gap:20px;text-align:left;background:transparent;border:0;padding:28px 0;cursor:pointer;color:#003139}
.gtb:hover .gtn{color:#00A3B3}
.gtn{transition:color .25s}
.coords{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.faqb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:left;background:transparent;border:0;padding:24px 0;cursor:pointer;font-family:'League Spartan',sans-serif;font-weight:700;font-size:22px;color:#003139;min-height:56px}
.plus{flex:none;width:36px;height:36px;border-radius:10px;background:#005A6E;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;transition:transform .35s}
.plus.x{transform:rotate(45deg);background:#00A3B3}

/* ticket */
.ticket{display:grid;grid-template-columns:230px 1fr 150px;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.ticket:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.3)}
.bars{transition:opacity .3s}.ticket:hover .bars{opacity:.7}
.bars{height:100%;min-height:170px;background:repeating-linear-gradient(0deg,#003139 0 3px,transparent 3px 6px,#003139 6px 7px,transparent 7px 11px)}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.mcta{display:none}
.progress{position:fixed;top:0;left:0;height:2px;width:100%;background:#4FD9EC;transform-origin:0 50%;transform:scaleX(0);z-index:60}

@media (max-width:900px){
.sp-sec{min-height:0}
.spk{flex-basis:75vw !important}
.hero{height:auto;min-height:100svh}
.hero-h1{font-size:76px !important}
.hero-logo svg{max-height:none;margin:0}
.hero-grid{grid-template-columns:1fr;gap:8px;padding-top:8px}
.hero-logo{order:-1;max-width:150px !important}
.hide-m{display:none !important}
.g2{grid-template-columns:1fr}
.ticket{grid-template-columns:1fr;transform:none}
.bars-wrap{display:none}
.slot{grid-template-columns:1fr;gap:4px}
.wrap{padding:0 20px}
.t-xxl{font-size:76px !important}
.t-xl{font-size:56px !important}
.t-l{font-size:44px !important}
.cd-box{min-width:68px;padding:10px 10px}
.mcta{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:50;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .35s,transform .35s}
.past-hero .mcta{opacity:1;transform:none;pointer-events:auto}
.hero-logo{display:none !important}
.hero-grid{padding-bottom:56px !important}
.hs3{margin-top:24px !important}
.mcta a{flex:1}
.faqb{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none !important;transition:none !important}
.anim .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">

<div style="width: 100%; background: #E8FDFF; color: #003139; font-family: 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 1.6; overflow-x: hidden">

<div class="progress" data-progress="1" aria-hidden="true"></div>

<sc-if value="{{ intro }}" hint-placeholder-val="{{ false }}">
<div class="intro {{ introCls }}" aria-hidden="{{ introHidden }}">
<svg class="ilogo" viewBox="-0.2 -0.2 10.4 9.06" role="img" aria-label="Logo Em Público">
<polygon pathLength="1" points="4,1.73 5,0.00 6,1.73" fill="#00A3B3"></polygon>
<polygon pathLength="1" points="3,3.46 4,1.73 5,3.46" fill="#00A3B3"></polygon>
<polygon pathLength="1" points="4,1.73 6,1.73 5,3.46" fill="#4FD9EC"></polygon>
<polygon pathLength="1" points="5,3.46 6,1.73 7,3.46" fill="#00A3B3"></polygon>
<polygon pathLength="1" points="2,5.20 3,3.46 4,5.20" fill="#00A3B3"></polygon>
<polygon pathLength="1" points="3,3.46 5,3.46 4,5.20" fill="#B8F0FA"></polygon>
<polygon pathLength="1" points="4,5.20 5,3.46 6,5.20" fill="#02646C"></polygon>
<polygon pathLength="1" points="5,3.46 7,3.46 6,5.20" fill="#4FD9EC"></polygon>
